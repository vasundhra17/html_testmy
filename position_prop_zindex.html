<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Properties - Z-Index</title>
    <style>
        .container{
            position: relative;
        }
        .box1 , .box2{
            position:absolute;
            border: 3px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 25px;
        }
        .box1{
            background-color:aqua;
            top: 60px;
            left: 20px;
            z-index: 2;
        }
        .box2{
            background-color:lightcoral;
            top: 20px;
            left: 60px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Z-index2</div>
        <div class="box2">Z-index1</div>
    </div>
</body>
</html>
