<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font family</title>
    <style>
        #first{font-family: 'Courier New', Courier, monospace;}
        #second{font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}
        #third{font-family: 'Times New Roman', Times, serif;}
    </style>


</head>
<body>
    <p id="first">this is my first line</p>
    <p id="second">this is my second line</p>
    <p id="third">this is my third line</p>
    
</body>
</html>
