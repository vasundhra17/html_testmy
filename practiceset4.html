<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice set 4</title>
    <style>
        .progress-container{
            width: 90%;
            height: 25px;
            background-color: blanchedalmond;
            border: 2px solid black;
            border-radius: 20px;
            position: relative;
            left:4%;
        }
        .progress-bar{
            background-color: mediumorchid;
            height:100%;
            
            border-radius: 10px;
            animation: animate_progress 3s ease-in-out;
        }
        @keyframes animate_progress{
            0%{width:0%;}
            90%{width:95%;}
            95%{width:70%;}
            100%{width:100%;}
            
        }
    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar">
        </div>
    </div>    
</body>
</html>
