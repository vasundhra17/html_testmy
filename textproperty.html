<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text property</title>
    <style>
        .box{height:100px;width:100px;}
        #box1{background-color: aqua; text-align: center;text-transform: capitalize;}
        #box2{background-color: coral; text-align: left;text-transform: lowercase;}
        #box3{background-color: deeppink; text-align: right;text-transform: uppercase;}
        #box1{text-decoration: underline;
            text-decoration-style:wavy ;
            text-decoration-color: rgb(21, 123, 226);
        }
        #link{
            text-decoration: none;
        }

    </style>
     
</head>
<body>
    <div id="box1" class="box">box</div><br>
    <div id="box2" class="box">box</div><br>
    <div id="box3" class="box">box</div><br>
    <a id="link" href="#">this is a line</a>
    
</body>
</html>
