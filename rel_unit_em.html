<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative unit: em</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #first{
            height:100px;
            width:200px;
            font-size: 10px;
            background-color: aqua;
        }
        #second{
            height:60%;
            width:50%;
            font-size: 2em;
            background-color: grey;
        }
    </style>
</head>
<body>
    <div id="first">First div
        <div id="second">Second div</div>
    </div>
    
</body>
</html>
